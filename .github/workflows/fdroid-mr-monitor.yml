name: F-Droid MR Monitor

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      force_notify:
        description: 'Force send status notification to Telegram'
        type: boolean
        default: false

concurrency:
  group: fdroid-mr-monitor
  cancel-in-progress: false

jobs:
  check-mrs:
    name: Check All F-Droid MRs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore monitor state cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: state/
          key: fdroid-mr-state-${{ github.run_id }}
          restore-keys: fdroid-mr-state-

      - name: Monitor F-Droid Merge Requests
        shell: bash
        env:
          FORCE_NOTIFY: ${{ inputs.force_notify || 'false' }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p state
          STATE_FILE="state/monitor_state.json"

          send_telegram() {
            local title="$1"
            local status="$2"
            local message="$3"
            local url="$4"
            local url_text="${5:-View MR on GitLab ↗}"

            local icon="ℹ️"
            local tag="[INFO]"
            case "$status" in
              success) icon="✅"; tag="[SUCCESS]" ;;
              failure) icon="❌"; tag="[FAILED]" ;;
              warning) icon="⚠️"; tag="[WARNING]" ;;
              release) icon="🚀"; tag="[RELEASE]" ;;
              mr)      icon="🔀"; tag="[MERGE REQUEST]" ;;
            esac

            local text="$icon <b>F-Droid Watcher</b> $tag"$'\n'
            text+="<b>$title</b>"$'\n\n'
            if [ -n "$message" ]; then
              text+="$message"$'\n\n'
            fi
            text+="<a href=\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\">View Workflow Run</a>"

            local payload
            if [ -n "$url" ]; then
              payload=$(jq -n \
                --arg chat_id "$TELEGRAM_CHAT_ID" \
                --arg text "$text" \
                --arg btn_text "$url_text" \
                --arg btn_url "$url" \
                '{
                  chat_id: $chat_id,
                  text: $text,
                  parse_mode: "HTML",
                  disable_web_page_preview: true,
                  reply_markup: {
                    inline_keyboard: [[{text: $btn_text, url: $btn_url}]]
                  }
                }')
            else
              payload=$(jq -n \
                --arg chat_id "$TELEGRAM_CHAT_ID" \
                --arg text "$text" \
                '{
                  chat_id: $chat_id,
                  text: $text,
                  parse_mode: "HTML",
                  disable_web_page_preview: true
                }')
            fi

            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -H "Content-Type: application/json" \
              -d "$payload" > /tmp/tg_out.json

            if jq -e '.ok == true' /tmp/tg_out.json >/dev/null 2>&1; then
              echo "Telegram alert sent: $title"
            else
              echo "Warning: Telegram send failed for $title:"
              cat /tmp/tg_out.json
            fi
          }

          echo "Querying GitLab API for all F-Droid MRs authored by naman-chopra..."
          MR_LIST=$(curl -s --connect-timeout 15 --retry 3 "https://gitlab.com/api/v4/projects/36528/merge_requests?author_username=naman-chopra")

          if [ -z "$MR_LIST" ] || ! echo "$MR_LIST" | jq -e 'type == "array"' >/dev/null 2>&1; then
            echo "Failed to fetch valid MR list from GitLab API. Exiting."
            exit 1
          fi

          TOTAL_MRS=$(echo "$MR_LIST" | jq 'length')
          echo "Found $TOTAL_MRS merge request(s) on GitLab."

          if [ ! -f "$STATE_FILE" ]; then
            echo "{}" > "$STATE_FILE"
          fi

          # Read existing state JSON into a variable
          SAVED_STATE=$(cat "$STATE_FILE")
          NEW_STATE="$SAVED_STATE"

          echo "$MR_LIST" | jq -c '.[]' | while read -r mr; do
            IID=$(echo "$mr" | jq -r '.iid')
            TITLE=$(echo "$mr" | jq -r '.title // "Untitled MR"')
            STATE=$(echo "$mr" | jq -r '.state // "unknown"')
            NOTES=$(echo "$mr" | jq -r '.user_notes_count // 0')
            URL=$(echo "$mr" | jq -r '.web_url // ""')
            LABELS=$(echo "$mr" | jq -r '.labels | join(", ")')
            UPDATED=$(echo "$mr" | jq -r '.updated_at // ""')

            echo "Processing MR !$IID ($TITLE) - State: $STATE, Notes: $NOTES"

            PREV_ENTRY=$(echo "$SAVED_STATE" | jq -r --arg iid "$IID" '.[$iid] // empty')

            if [ -z "$PREV_ENTRY" ]; then
              echo "First time tracking MR !$IID. Registering in state."
              if [ "$FORCE_NOTIFY" = "true" ]; then
                MSG="Now tracking <b>$TITLE</b>"$'\n\n'
                MSG+="<b>State:</b> $STATE"$'\n'
                MSG+="<b>Comments:</b> $NOTES"$'\n'
                MSG+="<b>Labels:</b> $LABELS"
                send_telegram "F-Droid Monitor: Tracked MR !$IID" "info" "$MSG" "$URL"
              fi
            else
              PREV_STATE=$(echo "$PREV_ENTRY" | jq -r '.state // "unknown"')
              PREV_NOTES=$(echo "$PREV_ENTRY" | jq -r '.notes // 0')

              if [ "$STATE" = "merged" ] && [ "$PREV_STATE" != "merged" ]; then
                MSG="<b>$TITLE</b> has been successfully merged into F-Droid!"$'\n\n'
                MSG+="The application will be built and signed in the next F-Droid index cycle."
                send_telegram "🎉 F-Droid MR !$IID MERGED!" "success" "$MSG" "$URL"
              elif [ "$STATE" = "closed" ] && [ "$PREV_STATE" != "closed" ]; then
                MSG="<b>$TITLE</b> was closed on F-Droid."
                send_telegram "⚠️ F-Droid MR !$IID Closed" "warning" "$MSG" "$URL"
              elif [ "$NOTES" -gt "$PREV_NOTES" ]; then
                MSG="New activity on <b>$TITLE</b>"$'\n\n'
                MSG+="<b>Total Comments:</b> $NOTES"$'\n'
                MSG+="<b>Status:</b> $STATE"$'\n'
                MSG+="<b>Labels:</b> $LABELS"
                send_telegram "💬 New Comment on MR !$IID" "mr" "$MSG" "$URL"
              elif [ "$FORCE_NOTIFY" = "true" ]; then
                MSG="<b>Title:</b> $TITLE"$'\n'
                MSG+="<b>State:</b> $STATE"$'\n'
                MSG+="<b>Comments:</b> $NOTES"$'\n'
                MSG+="<b>Labels:</b> $LABELS"
                send_telegram "F-Droid MR !$IID Status Check" "info" "$MSG" "$URL"
              fi
            fi

            # Update state file for this IID
            UPDATED_JSON=$(jq \
              --arg iid "$IID" \
              --arg state "$STATE" \
              --argjson notes "$NOTES" \
              --arg updated "$UPDATED" \
              '.[$iid] = {state: $state, notes: $notes, updated: $updated}' \
              "$STATE_FILE")
            echo "$UPDATED_JSON" > "$STATE_FILE"
          done

      - name: Save monitor state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state/
          key: fdroid-mr-state-${{ github.run_id }}
