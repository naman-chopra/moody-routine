name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Release Keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/moodyroutine-release.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build APKs
        run: |
          ./gradlew assembleFossRelease assembleGmsRelease assembleFossDebug --stacktrace
        env:
          KEYSTORE_PATH: moodyroutine-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare Artifacts & Checksums
        id: prepare-artifacts
        run: |
          mkdir -p release-artifacts
          TAG_NAME="${GITHUB_REF_NAME:-latest}"

          # Helper function to find and copy APKs (handles signed vs unsigned fallbacks)
          copy_apk() {
            local search_path="$1"
            local dest_name="$2"
            if [ -f "${search_path}/app-foss-release.apk" ]; then
              cp "${search_path}/app-foss-release.apk" "release-artifacts/${dest_name}"
            elif [ -f "${search_path}/app-foss-release-unsigned.apk" ]; then
              cp "${search_path}/app-foss-release-unsigned.apk" "release-artifacts/${dest_name}"
            elif [ -f "${search_path}/app-gms-release.apk" ]; then
              cp "${search_path}/app-gms-release.apk" "release-artifacts/${dest_name}"
            elif [ -f "${search_path}/app-gms-release-unsigned.apk" ]; then
              cp "${search_path}/app-gms-release-unsigned.apk" "release-artifacts/${dest_name}"
            elif [ -f "${search_path}/app-foss-debug.apk" ]; then
              cp "${search_path}/app-foss-debug.apk" "release-artifacts/${dest_name}"
            fi
          }

          copy_apk "app/build/outputs/apk/foss/release" "MoodyRoutine-${TAG_NAME}-foss.apk"
          copy_apk "app/build/outputs/apk/gms/release" "MoodyRoutine-${TAG_NAME}-gms.apk"
          copy_apk "app/build/outputs/apk/foss/debug" "MoodyRoutine-${TAG_NAME}-foss-debug.apk"

          # Generate SHA-256 Checksums
          cd release-artifacts
          sha256sum *.apk > checksums.txt
          cat checksums.txt
          cd ..

          # Prepare release notes footer
          CHECKSUMS_MD=$(awk '{print "- `" $2 "`: `" $1 "`"}' release-artifacts/checksums.txt)
          {
            echo "### Package Verification"
            echo ""
            echo "**Signing Certificate SHA-256:**"
            echo "\`E1:22:92:3E:45:9F:D6:ED:0A:DD:A5:1A:53:0B:BE:61:DF:8D:66:F8:E8:28:AA:B8:7A:82:07:AD:B6:61:E9:CB\`"
            echo ""
            echo "#### SHA-256 Checksums"
            echo "$CHECKSUMS_MD"
          } > release_notes_footer.md

      - name: Determine Pre-release status
        id: check-prerelease
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == *"-"* || "$TAG" == *"pre"* || "$TAG" == *"alpha"* || "$TAG" == *"beta"* || "$TAG" == *"rc"* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        id: create-release
        uses: softprops/action-gh-release@v2
        with:
          name: "MoodyRoutine ${{ github.ref_name }}"
          files: release-artifacts/*
          body_path: release_notes_footer.md
          prerelease: ${{ steps.check-prerelease.outputs.is_prerelease }}
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Telegram Release Notification
        if: success() && secrets.TELEGRAM_BOT_TOKEN != '' && secrets.TELEGRAM_CHAT_ID != ''
        uses: ./.github/actions/telegram-notify
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          project: 'MoodyRoutine'
          status: 'release'
          title: 'Release ${{ github.ref_name }} Published'
          message: 'New APKs compiled, signed, and published to GitHub Releases.'
          url: 'https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}'
          url-text: 'View Release on GitHub ↗'

